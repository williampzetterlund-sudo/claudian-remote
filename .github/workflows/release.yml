name: Release (remote build)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build styles
        run: node scripts/build-css.mjs

      - name: Build browser bundle (no token baked)
        run: node esbuild.ignis.mjs dist

      - name: Sanity-check artifacts
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
            if (manifest.isDesktopOnly !== false) throw new Error('isDesktopOnly must be false');
            if (manifest.version !== process.env.GITHUB_REF_NAME) {
              throw new Error('manifest version ' + manifest.version + ' != tag ' + process.env.GITHUB_REF_NAME);
            }
            const bundle = fs.readFileSync('dist/main.js', 'utf8');
            if (!bundle.includes('CLAUDIAN')) throw new Error('bundle looks wrong');
            console.log('manifest', manifest.version, 'minAppVersion', manifest.minAppVersion, 'bundle', (bundle.length/1e6).toFixed(1) + ' MB');
          "

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/main.js dist/manifest.json dist/styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes "Browser/remote build (Obsidian mobile via BRAT + Obsidian-in-browser). Requires a running claudian-bridge — see bridge/README.md and REMOTE.md."
